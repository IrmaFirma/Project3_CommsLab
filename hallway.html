<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hallway of The Dinner Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="hallway">

  <header class="menu">

    <a class="thename" href="index.html">The Dinner Party</a>

    <nav><ul>
      <li><a href="index.html">Welcome</a></li>
      <li><a href="front-door.html">Front door</a></li>
      <li><a href="living-room.html">Living room</a></li>
      <li><a href="hallway.html" class="active">Hallway</a></li>
      <li><a href="kitchen.html">Kitchen</a></li>
      <li><a href="staircase.html">Staircase</a></li>
      <li><a href="upstairs-hall.html">Upstairs hallway</a></li>
      <li><a href="bedroom.html">Bedroom</a></li>
    </ul></nav>

  </header>

  <main>

    <!-- scene: the hallway picture, then the video walks you down it (the video has no sound) -->
    <!-- the hallway is dim and one light keeps flickering (see "hallway flicker" in styles.css) -->
    <div class="scene hallway-flicker">
      <video id="hallway-video" src="assets/hallway.mp4" poster="assets/5.JPG" muted playsinline preload="auto"></video>
    </div>

    <p id="room-message">The party is still going behind you.</p>

    <!-- sounds: the party fades out, soft music underneath, footsteps, whispers from the kitchen,
         then glass breaks close by, someone is dragged away, a short muffled sound, and angry whispers -->
    <!-- the same party sound as the living room, so it fades out behind you -->
    <audio id="party-sound" src="audio/conversation-and-laughter.mp3" loop></audio>
    <audio id="music-sound" src="audio/eerie-background-music.mp3" loop></audio>
    <!-- TODO: plain footsteps still missing (not the glass ones), add them as audio/footsteps.mp3 -->
    <audio id="footsteps-sound" src="audio/footsteps.mp3" loop></audio>
    <!-- TODO: whispers recording still missing (same file the staircase uses) -->
    <audio id="whisper-sound" src="audio/whispers.mp3"></audio>
    <audio id="glass-sound" src="audio/glass-shattering.mp3"></audio>
    <!-- shuffling and scraping as someone is dragged away -->
    <audio id="drag-sound" src="audio/shuffling-feet.mp3"></audio>
    <!-- TODO: short muffled sound still missing, add it as audio/muffled-cry.mp3 -->
    <audio id="muffled-sound" src="audio/muffled-cry.mp3"></audio>

    <div class="controls">
      <button id="walk-button" class="button" type="button">Walk down the hallway</button>
      <a id="next-button" class="button" href="kitchen.html" hidden>Go to the kitchen</a>
    </div>

  </main>
  <footer>Made by Jayden, Mariam and Irma @NYUAD.</footer>

  <script src="hallway.js"></script>

</body>

</html>
