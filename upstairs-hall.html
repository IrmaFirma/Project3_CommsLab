  <main>
    <!-- scene: the hallway video. a dark layer on top of it dims everything except a circle
         around the mouse (the flashlight, see "video flashlight" in styles.css and flashlight.js).
         the video has its own sound -->
    <!-- used this documentation to learn about the video element and its attributes (poster, preload, playsinline): https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/video -->
    <!-- "poster" is the picture shown until the video is ready, "preload" tells the browser to start
         downloading it straight away-->
    <div class="scene flashlight video-flashlight">
      <video id="hall-video" src="assets/upstairs-hallway-video.mp4" poster="assets/10.JPG" playsinline preload="auto"></video>
      <div class="flashlight-dim"></div>
    </div>

    <p id="room-message">Move your mouse to light the way.</p>

    <div class="controls">
      <button id="enter-button" class="button" type="button" hidden>Enter the room</button>
    </div>

  </main>
  <footer>Made by Jayden, Mariam and Irma @NYUAD.</footer>

  <script src="flashlight.js"></script>
  <script src="upstairs-hall.js"></script>

</body>
