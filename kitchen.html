<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen of The Dinner Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Karla:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="kitchen">

  <header class="menu">

    <a class="thename" href="index.html">The Dinner Party</a>

    <nav>
      <ul>
        <li><a href="index.html">Welcome</a></li>
        <li><a href="front-door.html">Front door</a></li>
        <li><a href="living-room.html">Living room</a></li>
        <li><a href="hallway.html">Hallway</a></li>
        <li><a href="kitchen.html" class="active">Kitchen</a></li>
        <li><a href="staircase.html">Staircase</a></li>
        <li><a href="upstairs-hall.html">Upstairs hallway</a></li>
        <li><a href="bedroom.html">Bedroom</a></li>
      </ul>
    </nav>

  </header>

  <main>
    <h1>Kitchen</h1>

    <p>Whoever was here is gone.</p>

    <!-- scene: the kitchen with broken cups and plates on the floor. when you walk across it,
         the picture slowly moves toward the stairs (see "kitchen walk" in styles.css) -->
    <div class="scene kitchen-scene">
      <img id="photo-kitchen" src="assets/6.JPG"
        alt="A dim kitchen with broken cups and plates on the floor and a staircase through the door">
    </div>

    <p id="room-message">The kitchen is quiet.</p>

    <!-- sounds: the fridge hums and the tap drips the whole time, the music gets creepier,
         then footsteps crunch on the broken glass -->
    <audio id="fridge-sound" src="audio/fridge-hum.mp3" loop></audio>
    <audio id="tap-sound" src="audio/dripping-tap.mp3" loop></audio>
    <audio id="music-sound" src="audio/eerie-background-music.mp3" loop></audio>
    <audio id="crunch-sound" src="audio/crunch-of-footsteps.mp3"></audio>

    <div class="controls">
      <button id="enter-button" class="button" type="button">Step into the kitchen</button>
      <button id="walk-button" class="button" type="button" hidden>Walk across the kitchen</button>
      <a id="next-button" class="button" href="staircase.html" hidden>Go to the staircase</a>
    </div>

  </main>
  <footer>Made by Jayden, Mariam and Irma @NYUAD.</footer>

  <script src="kitchen.js"></script>

</body>

</html>
