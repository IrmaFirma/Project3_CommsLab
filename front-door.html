<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Front door of The Dinner Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Karla:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="front-door">

  <header class="menu">


    <a class="thename" href="index.html">The Dinner Party</a>

    <nav>
      <ul>
        <li><a href="index.html">Welcome</a></li>
        <li><a href="front-door.html" class="active">Front door</a></li>
        <li><a href="living-room.html">Living room</a></li>
        <li><a href="hallway.html">Hallway</a></li>
        <li><a href="kitchen.html">Kitchen</a></li>
        <li><a href="staircase.html">Staircase</a></li>
        <li><a href="upstairs-hall.html">Upstairs hallway</a></li>
        <li><a href="bedroom.html">Bedroom</a></li>
      </ul>
    </nav>

  </header>

  <main>
    <!-- scene: door photo1, door photo2 then black screen then the couple at the door -->
    <div class="scene">
      <img id="photo-before" src="assets/1.JPG">
      <img id="photo-after" src="assets/2.JPG" hidden>

      <div id="blackout" class="blackout" hidden></div>
      <img id="photo-couple" src="assets/3.PNG" hidden>

    </div>



    <p id="door-message">You are standing at the door.</p>

    <!-- sounds -->
    <audio id="doorbell-sound" src="audio/doorbell.mp3"></audio>
    <audio id="come-in-sound" src="audio/come-in.mp3"></audio>
    <audio id="come-in-sound2" src="audio/welcome.wav"></audio>

    <!-- buttons -->
    <div class="controls">
      <button id="ring-button" class="button" type="button">Ring the doorbell</button>
      <button id="come-in-button" class="button" type="button" hidden>Play the greeting</button>
      <a id="next-button" class="button" href="living-room.html" hidden>Go to the living room</a>
    </div>

  </main>
  <footer>Made by Jayden, Mariam and Irma @NYUAD.</footer>

  <script src="front-door.js"></script>


</body>

</html>
